name: B-SHIELD CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Syntax & Bytecode Compilation Check
        run: |
          python -m compileall backend

      - name: Lint with Ruff
        run: |
          ruff check backend

      - name: Run Backend Unit & Integration Tests
        env:
          MONGODB_URI: "mongodb://localhost:27017"
          MONGODB_DB_NAME: "ibvap_test"
          JWT_SECRET: "ci_testing_secret_key_12345"
          ENVIRONMENT: "testing"
        run: |
          pytest backend/tests -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build production bundle with Vite
        working-directory: ./frontend
        run: npm run build
